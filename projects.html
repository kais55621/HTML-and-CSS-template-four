<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Font Awesome Library -->
        <link rel="stylesheet" href="css/all.min.css">
        <!-- Main Css File -->
        <link rel="stylesheet" href="css/frame-work.css">         
        <link rel="stylesheet" href="css/main-style.css">
        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <title>Projects</title>

    <body>
        <div class="page d-flex">

                <h3 class="p-rel mt-0 text-c">Kais</h3>
                <ul>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="index.html">

                            <span class="ml-10 hide-mobile">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="settings.html">
                            <i class="fa-solid fa-gear fa-fw"></i>

                        </a>
                    </li>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="Profile.html">

                        </a>
                    </li>
                    <li>
                        <a class="active d-flex align-center fs-14 c-black rad-6 p-10" href="Projects.html">
                            <i class="fa-solid fa-diagram-project fa-fw"></i>

                        </a>
                    </li>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="Courses.html">
                            <i class="fa-solid fa-graduation-cap fa-fw"></i>

                        </a>
                    </li>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="Friends.html">

                        </a>
                    </li>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="Files.html">

                        </a>
                    </li>
                    <li>
                        <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="Plans.html">
                            <i class="fa-regular fa-credit-card fa-fw"></i>
                            <span class="ml-10 hide-mobile">Plans</span>
                        </a>
                    </li>
                </ul>

            <div class="content w-full">
                <!-- Start Head -->
                <div class="head bg-white p-15 flex-between ">
                    <div class="search p-rel">
                        <input class="p-10 border-1-ccc rad-10" type="search" placeholder="Type A Keyword">
                    </div>
                    <div class="icons d-flex align-center">
                        <span class="notification p-rel">
                            <i class="fa-regular fa-bell fa-lg"></i>
                        </span>
                        <img src="images/avatar.png" alt="image">
                    </div>
                </div>
                <!-- End Head -->
                <h1 class="p-rel">Projects</h1>
                <div class="profile-page m-20">
                </div>
            </div>
